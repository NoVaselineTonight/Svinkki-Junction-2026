<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17261e">
  <title>Snake — A little classic</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #17261e;
      --panel: #203329;
      --line: #35493b;
      --text: #f3f3df;
      --muted: #a6b5a5;
      --green: #c5ef70;
      --green-dark: #87b842;
      --board: #1c2e24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background: radial-gradient(circle at 50% 15%, #263d2e 0, var(--page) 55%);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--green); outline-offset: 5px; }

    main { width: min(100%, 540px); }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 46px);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .new-game {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 15px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 150ms, border-color 150ms;
    }

    .new-game:hover { background: var(--panel); border-color: var(--green-dark); }

    .scoreboard {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-card {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 17px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .score { color: var(--green); font-size: 23px; font-weight: 700; }

    .game-shell {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #476040;
      border-radius: 15px;
      background: var(--board);
      box-shadow: 0 20px 55px #0b150d66;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #142319df;
      backdrop-filter: blur(4px);
      transition: opacity 180ms;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay-icon {
      display: grid;
      place-items: center;
      width: 65px;
      height: 65px;
      margin-bottom: 19px;
      border-radius: 20px;
      background: var(--green);
      color: var(--page);
      font-family: sans-serif;
      font-size: 32px;
      transform: rotate(-6deg);
    }

    .overlay h2 { margin: 0 0 10px; font-size: 26px; letter-spacing: -0.05em; }
    .overlay p { margin: 0 0 24px; color: var(--muted); font-size: 13px; line-height: 1.7; }

    .play-button {
      border: 0;
      border-radius: 9px;
      padding: 14px 25px;
      background: var(--green);
      color: var(--page);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--green-dark);
      transition: transform 120ms, box-shadow 120ms;
    }

    .play-button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--green-dark); }
    .play-button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }

    .instructions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .instructions p { margin: 0; }
    kbd { color: var(--text); font: inherit; }

    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 46px);
      justify-content: center;
      gap: 7px;
      margin-top: 21px;
    }

    .touch-controls button {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--green);
      font-size: 20px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-controls button:active { background: var(--green); color: var(--page); }
    .touch-controls .up { grid-column: 2; }
    .touch-controls .left { grid-column: 1; grid-row: 2; }
    .touch-controls .down { grid-column: 2; grid-row: 2; }
    .touch-controls .right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 600px) {
      body { padding-block: 22px; }
      .touch-controls { display: grid; }
      .desktop-instructions { display: none; }
      .mobile-instructions { display: block !important; text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <p class="eyebrow">A little classic</p>
        <h1>Snake.</h1>
      </div>
      <button class="new-game" id="new-game" type="button">↻ New game</button>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card">
        <span class="score-label">Score</span>
        <span class="score" id="score">000</span>
      </div>
      <div class="score-card">
        <span class="score-label">Best</span>
        <span class="score" id="best">000</span>
      </div>
    </section>

    <div class="game-shell">
      <canvas id="game" width="600" height="600" aria-label="Snake game board. Use arrow keys or WASD to move, and Space to pause." role="img"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-icon" id="overlay-icon" aria-hidden="true">▶</div>
        <h2 id="overlay-title">Ready to slither?</h2>
        <p id="overlay-message">Eat the apples. Grow your snake.<br>Don't hit the walls or yourself!</p>
        <button class="play-button" id="play" type="button">Start game</button>
      </div>
    </div>

    <div class="instructions">
      <p class="desktop-instructions"><kbd>↑ ↓ ← →</kbd> or <kbd>WASD</kbd> to move</p>
      <p class="desktop-instructions"><kbd>Space</kbd> to pause</p>
      <p class="mobile-instructions" style="display: none">Swipe or use the controls to move</p>
    </div>

    <nav class="touch-controls" aria-label="Snake direction controls">
      <button class="up" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="left" type="button" data-direction="left" aria-label="Move left">←</button>
      <button class="down" type="button" data-direction="down" aria-label="Move down">↓</button>
      <button class="right" type="button" data-direction="right" aria-label="Move right">→</button>
    </nav>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const context = canvas.getContext('2d');
      const scoreElement = document.getElementById('score');
      const bestElement = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayIcon = document.getElementById('overlay-icon');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayMessage = document.getElementById('overlay-message');
      const playButton = document.getElementById('play');

      const cells = 20;
      const cellSize = canvas.width / cells;
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake;
      let food;
      let direction;
      let directionQueue;
      let score;
      let best = loadBest();
      let state = 'idle';
      let stepDuration = 140;
      let previousTime = 0;
      let accumulator = 0;
      let touchStart = null;

      function loadBest() {
        try {
          const saved = Number(localStorage.getItem('snake-best'));
          return Number.isInteger(saved) && saved >= 0 ? saved : 0;
        } catch {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem('snake-best', String(best));
        } catch {
          // The game still works when storage is unavailable.
        }
      }

      function setOverlay(icon, title, message, button) {
        overlayIcon.textContent = icon;
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        playButton.textContent = button;
        overlay.classList.remove('hidden');
        overlay.setAttribute('aria-live', 'polite');
      }

      function prepareGame() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = directions.right;
        directionQueue = [];
        food = { x: 15, y: 10 };
        score = 0;
        stepDuration = 140;
        accumulator = 0;
        scoreElement.textContent = '000';
        bestElement.textContent = String(best).padStart(3, '0');
      }

      function startGame() {
        prepareGame();
        state = 'running';
        overlay.classList.add('hidden');
        canvas.focus({ preventScroll: true });
      }

      function pauseGame() {
        if (state === 'running') {
          state = 'paused';
          setOverlay('Ⅱ', 'Taking a breather', 'Your snake will wait for you.', 'Resume game');
        } else if (state === 'paused') {
          state = 'running';
          accumulator = 0;
          overlay.classList.add('hidden');
        }
      }

      function endGame(won = false) {
        state = 'over';
        setOverlay(
          won ? '★' : '×',
          won ? 'Board cleared!' : 'Game over',
          won ? `A perfect score of ${score}. Incredible!` : `You scored ${score} ${score === 1 ? 'point' : 'points'}. Fancy another go?`,
          'Play again'
        );
      }

      function updateDirection(name) {
        const next = directions[name];
        if (!next || state === 'paused' || state === 'over') return;
        if (state === 'idle') startGame();

        // Queue turns so quick inputs are not lost or able to reverse the snake.
        const last = directionQueue.length ? directionQueue[directionQueue.length - 1] : direction;
        if (next.x !== -last.x || next.y !== -last.y) {
          if ((next.x !== last.x || next.y !== last.y) && directionQueue.length < 2) {
            directionQueue.push(next);
          }
        }
      }

      function placeFood() {
        const available = [];
        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            if (!snake.some(segment => segment.x === x && segment.y === y)) {
              available.push({ x, y });
            }
          }
        }
        if (!available.length) {
          endGame(true);
          return;
        }
        food = available[Math.floor(Math.random() * available.length)];
      }

      function moveSnake() {
        if (directionQueue.length) direction = directionQueue.shift();
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };

        const hittingWall = head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells;
        const eating = head.x === food.x && head.y === food.y;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        if (hittingWall || bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 1;
          scoreElement.textContent = String(score).padStart(3, '0');
          if (score > best) {
            best = score;
            bestElement.textContent = String(best).padStart(3, '0');
            saveBest();
          }
          stepDuration = Math.max(65, 140 - score * 3);
          placeFood();
        } else {
          snake.pop();
        }
      }

      function roundedRect(x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
        context.fill();
      }

      function drawBoard() {
        context.fillStyle = '#1c2e24';
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = '#203328';
        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            if ((x + y) % 2 === 0) context.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }

      function drawFood() {
        const x = food.x * cellSize + cellSize / 2;
        const y = food.y * cellSize + cellSize / 2;
        context.fillStyle = '#ff816e';
        context.beginPath();
        context.arc(x, y + 1, cellSize * 0.31, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = '#ffb29e';
        context.beginPath();
        context.arc(x - 3, y - 2, cellSize * 0.07, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = '#c5ef70';
        context.lineWidth = 3;
        context.lineCap = 'round';
        context.beginPath();
        context.moveTo(x, y - 6);
        context.quadraticCurveTo(x + 1, y - 13, x + 7, y - 12);
        context.stroke();
      }

      function drawSnake() {
        for (let i = snake.length - 1; i >= 0; i--) {
          const segment = snake[i];
          const padding = i === 0 ? 2 : 2.5;
          context.fillStyle = i === 0 ? '#d4fa89' : i % 2 === 0 ? '#a5d957' : '#addf60';
          roundedRect(
            segment.x * cellSize + padding,
            segment.y * cellSize + padding,
            cellSize - padding * 2,
            cellSize - padding * 2,
            i === 0 ? 8 : 7
          );
        }

        const head = snake[0];
        const centerX = head.x * cellSize + cellSize / 2;
        const centerY = head.y * cellSize + cellSize / 2;
        const forwardX = direction.x * 5;
        const forwardY = direction.y * 5;
        const sideX = direction.y * 5.5;
        const sideY = -direction.x * 5.5;
        context.fillStyle = '#203329';
        for (const side of [-1, 1]) {
          context.beginPath();
          context.arc(centerX + forwardX + sideX * side, centerY + forwardY + sideY * side, 2.4, 0, Math.PI * 2);
          context.fill();
        }
      }

      function draw() {
        drawBoard();
        drawFood();
        drawSnake();
      }

      function gameLoop(time) {
        const elapsed = previousTime ? Math.min(time - previousTime, 200) : 0;
        previousTime = time;
        if (state === 'running') {
          accumulator += elapsed;
          while (accumulator >= stepDuration && state === 'running') {
            moveSnake();
            accumulator -= stepDuration;
          }
        }
        draw();
        requestAnimationFrame(gameLoop);
      }

      playButton.addEventListener('click', () => {
        if (state === 'paused') pauseGame();
        else startGame();
      });
      document.getElementById('new-game').addEventListener('click', startGame);

      document.addEventListener('keydown', event => {
        const keyMap = {
          ArrowUp: 'up', w: 'up', W: 'up',
          ArrowDown: 'down', s: 'down', S: 'down',
          ArrowLeft: 'left', a: 'left', A: 'left',
          ArrowRight: 'right', d: 'right', D: 'right'
        };
        if (keyMap[event.key]) {
          event.preventDefault();
          updateDirection(keyMap[event.key]);
          return;
        }
        if (event.code === 'Space' && event.target.tagName !== 'BUTTON') {
          event.preventDefault();
          if (state === 'idle' || state === 'over') startGame();
          else pauseGame();
        }
        if (event.key === 'Enter' && event.target.tagName !== 'BUTTON' && state !== 'running') {
          event.preventDefault();
          if (state === 'paused') pauseGame();
          else startGame();
        }
      });

      document.querySelectorAll('[data-direction]').forEach(button => {
        button.addEventListener('click', () => updateDirection(button.dataset.direction));
      });

      canvas.addEventListener('touchstart', event => {
        const touch = event.touches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });
      canvas.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
      canvas.addEventListener('touchend', event => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        updateDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'running') pauseGame();
      });

      canvas.tabIndex = 0;
      canvas.style.outline = 'none';
      prepareGame();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
