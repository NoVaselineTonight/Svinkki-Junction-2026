<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <title>Svinkki - your money coach</title>
  <link rel="icon" type="image/svg+xml" href="brand/s-mark.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <span class="logo"><img class="logo-mark" src="brand/s-mark.svg" alt="" height="30"><span class="logo-word" aria-hidden="true">Vinkki</span><span class="sr-only">Svinkki</span></span>
      <span class="topbar-sub" id="topbar-sub"></span>
      <div class="top-actions" id="top-actions" hidden>
        <button type="button" class="ask-btn" id="ask-btn" aria-haspopup="dialog"><span class="btn-icon" data-icon="help"></span><span>What can I ask?</span></button>
        <button type="button" class="gear-btn" id="gear-btn" aria-label="Settings" aria-haspopup="dialog"><span class="btn-icon" data-icon="gear"></span></button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1">
      <p class="muted pad">Loading...</p>
      <noscript><p class="pad">Svinkki needs JavaScript to run.</p></noscript>
    </main>

    <footer class="footer">Hackathon prototype for the S-Pankki challenge at Junction 2026. S-Pankki name and logo used with permission. Synthetic data.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
